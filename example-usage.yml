name: Example Usage of Hyve Cluster Action

on:
  push:
    branches: [ main ]

jobs:
  deploy-and-use-cluster:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Deploy cluster using Hyve Action
      uses: ./  # Use the local action (in a real workflow, this would be: uses: your-org/hyve-action@v1)
      with:
        action: 'add'
        cluster-name: 'my-app-cluster'
        region: 'PHX1'
        provider: 'civo'
        nodes: 'g4s.kube.medium,g4s.kube.medium'
        cluster-type: 'k3s'
      env:
        CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
    
    - name: Use exported cluster information
      run: |
        echo "Cluster deployed successfully!"
        echo "Name: $HYVE_CLUSTER_NAME"
        echo "IP Address: $HYVE_CLUSTER_IP_ADDRESS"
        echo "Access Port: $HYVE_CLUSTER_ACCESS_PORT"
        echo "Cluster ID: $HYVE_CLUSTER_ID"
        echo "Status: $HYVE_CLUSTER_STATUS"
        
    - name: Set up kubectl with cluster config
      run: |
        # Create kubectl config from exported kubeconfig
        mkdir -p ~/.kube
        echo "$HYVE_CLUSTER_KUBECONFIG" > ~/.kube/config
        
        # Verify cluster access
        kubectl get nodes
        kubectl get pods --all-namespaces
        
    - name: Deploy application to cluster
      run: |
        # Example: Deploy a simple nginx application
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nginx-deployment
        spec:
          replicas: 2
          selector:
            matchLabels:
              app: nginx
          template:
            metadata:
              labels:
                app: nginx
            spec:
              containers:
              - name: nginx
                image: nginx:latest
                ports:
                - containerPort: 80
        EOF
        
        # Wait for deployment to be ready
        kubectl rollout status deployment/nginx-deployment
        kubectl get pods -l app=nginx
        
    - name: Test cluster API access
      run: |
        # Test direct API access using the exported variables
        echo "Testing cluster API access..."
        curl -k "https://$HYVE_CLUSTER_IP_ADDRESS:$HYVE_CLUSTER_ACCESS_PORT/api/v1" || echo "API access test completed"
        
    - name: Output cluster endpoint for external use
      run: |
        echo "::notice title=Cluster Ready::Cluster $HYVE_CLUSTER_NAME is ready at $HYVE_CLUSTER_IP_ADDRESS:$HYVE_CLUSTER_ACCESS_PORT"