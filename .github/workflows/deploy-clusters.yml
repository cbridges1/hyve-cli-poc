name: Deploy Civo Clusters

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allow manual triggering with optional cluster parameters
    inputs:
      action:
        description: 'Action to perform (add, modify, delete)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'add'
          - 'modify'
          - 'delete'
      cluster-name:
        description: 'Name of the cluster'
        required: false
        default: ''
        type: string
      region:
        description: 'Region for the cluster'
        required: false
        default: 'PHX1'
        type: choice
        options:
          - 'PHX1'
          - 'NYC1'
          - 'FRA1'
          - 'LON1'
      nodes:
        description: 'Array of node sizes (comma-separated, e.g., "g4s.kube.small,g4s.kube.medium,g4s.kube.small")'
        required: false
        default: 'g4s.kube.small'
        type: string
      provider:
        description: 'Cloud provider for the cluster'
        required: false
        default: 'civo'
        type: choice
        options:
          - 'civo'
          - 'aws'
          - 'gcp'
          - 'azure'
      cluster-type:
        description: 'Type of Kubernetes cluster'
        required: false
        default: 'k3s'
        type: choice
        options:
          - 'k3s'
          - 'talos'
      master-cluster:
        description: 'Whether this is a master cluster'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allows the workflow to push changes to the repository
      actions: read    # Allows reading workflow metadata
      checks: read     # Allows reading check results
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
        
    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Download dependencies
      run: go mod download
      
    - name: Build application
      run: go build -o civo-cluster-deploy .
      
    - name: Generate cluster YAML from inputs
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != '' && github.event.inputs.cluster-name != ''
      run: |
        echo "=== GENERATING CLUSTER YAML FROM WORKFLOW INPUTS ==="
        echo "Action: ${{ github.event.inputs.action }}"
        echo "Cluster Name: ${{ github.event.inputs.cluster-name }}"
        echo "Region: ${{ github.event.inputs.region }}"
        echo "Provider: ${{ github.event.inputs.provider }}"
        echo "Nodes: ${{ github.event.inputs.nodes }}"
        echo "Cluster Type: ${{ github.event.inputs.cluster-type }}"
        echo "Master Cluster: ${{ github.event.inputs.master-cluster }}"
        echo ""
        
        # Build CLI command with the provided inputs
        CLI_COMMAND="./civo-cluster-deploy"
        CLI_COMMAND="$CLI_COMMAND -action=${{ github.event.inputs.action }}"
        CLI_COMMAND="$CLI_COMMAND -cluster-name=${{ github.event.inputs.cluster-name }}"
        CLI_COMMAND="$CLI_COMMAND -region=${{ github.event.inputs.region }}"
        CLI_COMMAND="$CLI_COMMAND -provider=${{ github.event.inputs.provider }}"
        CLI_COMMAND="$CLI_COMMAND -nodes=\"${{ github.event.inputs.nodes }}\""
        CLI_COMMAND="$CLI_COMMAND -cluster-type=${{ github.event.inputs.cluster-type }}"
        if [ "${{ github.event.inputs.master-cluster }}" == "true" ]; then
          CLI_COMMAND="$CLI_COMMAND -master-cluster=true"
        fi
        
        echo "Executing: $CLI_COMMAND"
        $CLI_COMMAND
        
    - name: Commit and push cluster configuration changes
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.action != '' && github.event.inputs.cluster-name != ''
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "=== COMMITTING CLUSTER CONFIGURATION CHANGES ==="
        
        # Configure git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Configure git to use the GitHub token for authentication
        git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
        
        # Check if there are changes to commit
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          echo "Changes detected, committing..."
          git add state/clusters/
          
          # Create commit message based on action
          if [ "${{ github.event.inputs.action }}" == "add" ]; then
            COMMIT_MSG="Add cluster configuration: ${{ github.event.inputs.cluster-name }}"
          elif [ "${{ github.event.inputs.action }}" == "modify" ]; then
            COMMIT_MSG="Modify cluster configuration: ${{ github.event.inputs.cluster-name }}"
          elif [ "${{ github.event.inputs.action }}" == "delete" ]; then
            COMMIT_MSG="Remove cluster configuration: ${{ github.event.inputs.cluster-name }}"
          else
            COMMIT_MSG="Update cluster configuration: ${{ github.event.inputs.cluster-name }}"
          fi
          
          COMMIT_MSG="$COMMIT_MSG [skip ci]"
          
          git commit -m "$COMMIT_MSG"
          git push origin main
          echo "✅ Changes committed and pushed to main branch"
        fi
        
    - name: Validate cluster configurations
      run: |
        echo "Validating cluster configurations..."
        if [ -d "state/clusters" ] && [ "$(find state/clusters -name '*.yaml' -o -name '*.yml' | wc -l)" -gt 0 ]; then
          echo "Found cluster configurations:"
          find state/clusters -name '*.yaml' -o -name '*.yml' | while read file; do
            echo "  - $(basename "$file")"
          done
        else
          echo "No cluster configurations found in state/clusters directory"
          echo "Skipping deployment as no clusters are defined"
          exit 0
        fi
        
    - name: Deploy clusters (dry-run on PR)
      if: github.event_name == 'pull_request'
      env:
        CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      run: |
        echo "=== DRY RUN MODE (Pull Request) ==="
        echo "This would execute: ./civo-cluster-deploy"
        echo "But we're skipping actual deployment for PR safety"
        echo "Cluster configurations would be processed:"
        if [ -d "state/clusters" ]; then
          find state/clusters -name '*.yaml' -o -name '*.yml' | while read file; do
            echo "  - Processing: $file"
            cat "$file"
            echo ""
          done
        fi
        
    - name: Deploy clusters (production)
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      run: |
        echo "=== PRODUCTION DEPLOYMENT ==="
        echo "Running cluster reconciliation..."
        
        # Check if CIVO_TOKEN is set
        if [ -z "$CIVO_TOKEN" ]; then
          echo "❌ CIVO_TOKEN secret is not set!"
          echo "Please add your Civo API token as a repository secret named 'CIVO_TOKEN'"
          exit 1
        fi
        
        # Run the cluster deployment
        ./civo-cluster-deploy
        
    - name: Deploy clusters (manual trigger)
      if: github.event_name == 'workflow_dispatch'
      env:
        CIVO_TOKEN: ${{ secrets.CIVO_TOKEN }}
      run: |
        echo "=== MANUAL DEPLOYMENT ==="
        
        # Check if CIVO_TOKEN is set
        if [ -z "$CIVO_TOKEN" ]; then
          echo "❌ CIVO_TOKEN secret is not set!"
          echo "Please add your Civo API token as a repository secret named 'CIVO_TOKEN'"
          exit 1
        fi
        
        # If cluster parameters were provided, we already created/modified the YAML files
        # and committed them. Now run reconciliation to deploy the changes.
        if [ "${{ github.event.inputs.action }}" != "" ] && [ "${{ github.event.inputs.cluster-name }}" != "" ]; then
          echo "Cluster configuration was updated via workflow inputs."
          echo "Running reconciliation to deploy the changes..."
        else
          echo "No cluster parameters provided. Running standard reconciliation..."
        fi
        
        # Run the cluster deployment
        ./civo-cluster-deploy
        
    - name: Display exported cluster information
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "=== EXPORTED CLUSTER INFORMATION ==="
        echo "These environment variables are now available for subsequent workflow steps:"
        echo ""
        if [ -n "$HYVE_CLUSTER_NAME" ]; then
          echo "✅ HYVE_CLUSTER_NAME: $HYVE_CLUSTER_NAME"
          echo "✅ HYVE_CLUSTER_IP_ADDRESS: $HYVE_CLUSTER_IP_ADDRESS"
          echo "✅ HYVE_CLUSTER_ACCESS_PORT: $HYVE_CLUSTER_ACCESS_PORT"
          echo "✅ HYVE_CLUSTER_ID: $HYVE_CLUSTER_ID"
          echo "✅ HYVE_CLUSTER_STATUS: $HYVE_CLUSTER_STATUS"
          echo "✅ HYVE_CLUSTER_KUBECONFIG: <available for use>"
          echo ""
          echo "Example usage in subsequent steps:"
          echo "  - name: Use cluster info"
          echo "    run: |"
          echo "      kubectl --kubeconfig <(echo \"\$HYVE_CLUSTER_KUBECONFIG\") get nodes"
          echo "      curl -k https://\$HYVE_CLUSTER_IP_ADDRESS:\$HYVE_CLUSTER_ACCESS_PORT/api/v1"
        else
          echo "❌ No cluster information exported (no active clusters found)"
        fi
        
    - name: Upload deployment logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: deployment-logs-${{ github.run_number }}
        path: |
          *.log
          state/
        retention-days: 30