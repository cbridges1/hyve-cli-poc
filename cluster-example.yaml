apiVersion: v1
kind: Cluster
metadata:
  name: master-cluster
  region: PHX1
spec:
  nodeCount: 1
  size: g4s.kube.xsmall
  clusterType: k3s
  masterCluster: true
  firewall:
    enabled: true
    rules:
      - protocol: tcp
        startPort: "6443"
        endPort: "6443"
        cidr:
          - 0.0.0.0/0
        direction: ingress
